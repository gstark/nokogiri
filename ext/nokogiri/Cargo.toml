[package]
name = "nokogiri"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
magnus = { version = "0.9.3", features = ["rb-sys"] }
xmloxide = { path = "vendor/xmloxide", default-features = false }

[profile.release]
lto = false
codegen-units = 16
